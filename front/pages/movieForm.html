<main> 
    <section class="movies-form-section" id="moviesFormContainer"> 
        <h1>Crear una Película</h1>
        <form id="movieForm">
            <div class="input-group">
                <label>Title</label>
                <input type="text" name="title" id="title"/>
            </div>
            <div class="input-group">
                <label>Año</label>
                <input type="number" name="year" id="year"/>
            </div>
            <div class="input-group">
                <label>Director</label>
                <input type="text" name="director" id="director"/>
            </div>
            <div class="input-group">
                <label>Duración</label>
                <input type="text" name="duration" id="duration" placeholder="2hs 16min"/>
            </div>
            <div class="input-group">
                <label>Género</label>
                <div class="genre-checkboxes" id="genreCheckBoxes"></div>
            </div>
            <div class="input-group">
                <label>Puntaje</label>
                <input type="number" name="rate" id="rate"/>
            </div>
            <div class="input-group">
                <label>Poster</label>
                <input type="url" name="poster" id="poster"/>
            </div>
            <div class="input-group">
                <label>Descripcion</label>
                <input type="text" name="description" id="description"/>
            </div>
            <div class="input-group">
                <label>Trailer</label>
                <input type="url" name="trailer" id="trailer"/>
            </div>
            <div class="movie-form-buttons">
                <button type="button" class="clear-form-button" id="clearFormButton">Limpiar Formulario</button>
                <button type="submit" class="submit-form-button">Enviar</button>
            </div>
        </form>
        </section> 
</main>
